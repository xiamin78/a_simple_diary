    <section class="main">
      <div class="settingPage">
        <div class="settingDiv">
          <div class="upSetting">
            <p>设置背景图片</p>

              <input
                type="text"
                class="settingInput"
                placeholder="请输入图片的链接"
              />
              <button class="bgPicBtn">保存</button>
            </form>
            <div class="splitLine"></div>
            <p>日记主体的位置</p>
            <form class="diaryPosition">
              <button class="beLeft">居左</button>
              <button class="beMiddle">居中</button>
              <button class="beRight">居右</button>
            </form>
            <div class="splitLine"></div>
            <div class="diarySizeSel">
              <p>日记的大小</p>
              <form class="diarySizeForm">
                <input type="text" class="settingInput" placeholder="50%~20%" />
                <button class="diarySizeBtn">保存</button>
              </form>
            </div>
          </div>
          <div class="downSetting">
            <button class="No">关闭</button>
          </div>
        </div>
      </div>
